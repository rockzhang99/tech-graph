<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fireworks Tech Graph · 控制台</title>
<link rel="stylesheet" href="/style.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎆</text></svg>" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">🎆</span>
    <div class="brand-text">
      <h1>Fireworks Tech Graph</h1>
      <p>几何安全的技术图 · 本地控制台</p>
    </div>
  </div>

  <div class="topbar-right">
    <div id="doctorStrip" class="doctor-strip">
      <span class="dot pending"></span><span class="doctor-text">检测环境…</span>
    </div>
    <button id="btnDoctor" class="btn ghost" type="button">环境详情</button>
    <button id="btnUpload" class="btn ghost" type="button">导入 SVG</button>
    <input id="fileSvg" type="file" accept=".svg" hidden />
    <input id="fileSpec" type="file" accept=".json" hidden />
  </div>
</header>

<main class="layout">

  <!-- ============ 左侧：配置 ============ -->
  <aside class="panel panel-left">
    <section class="block">
      <div class="block-head">
        <h2>1 · 图类型</h2>
        <span id="typeHint" class="hint">960 × 600</span>
      </div>
      <div id="typeChips" class="chips"></div>
    </section>

    <section class="block">
      <div class="block-head">
        <h2>2 · 视觉风格</h2>
        <span id="styleHint" class="hint">Style 1</span>
      </div>
      <div id="styleChips" class="chips styles"></div>
      <p id="styleWarn" class="warn" hidden></p>
    </section>

    <section class="block">
      <div class="block-head">
        <h2>3 · 图规格 JSON</h2>
        <div class="head-actions">
          <button id="btnExample" class="btn tiny" type="button">示例</button>
          <button id="btnLoadSpec" class="btn tiny" type="button">导入</button>
          <button id="btnFormat" class="btn tiny" type="button">格式化</button>
        </div>
      </div>
      <select id="exampleSelect" class="select">
        <option value="">— 选择内置示例 —</option>
      </select>
      <textarea id="editor" class="editor" spellcheck="false" placeholder="在此粘贴图规格 JSON，或从上方加载内置示例…"></textarea>
      <p id="jsonError" class="error" hidden></p>
    </section>

    <div class="render-bar">
      <button id="btnRender" class="btn primary block-btn" type="button">
        <span class="btn-label">渲染 SVG</span>
      </button>
    </div>
  </aside>

  <!-- ============ 中间：预览 ============ -->
  <section class="panel panel-center">
    <div class="preview-head">
      <div class="preview-title">
        <h2 id="previewTitle">预览</h2>
        <span id="previewMeta" class="hint">尚未渲染</span>
      </div>
      <div class="preview-tools">
        <button class="btn tiny" data-zoom="out" type="button">−</button>
        <input id="zoomRange" type="range" min="20" max="200" value="100" />
        <span id="zoomLabel" class="hint">100%</span>
        <button class="btn tiny" data-zoom="fit" type="button">适应</button>
        <div class="seg">
          <button id="bgLight" class="seg-btn active" type="button" title="浅色画布">浅</button>
          <button id="bgDark" class="seg-btn" type="button" title="深色画布">深</button>
          <button id="bgCheck" class="seg-btn" type="button" title="棋盘格背景">格</button>
        </div>
      </div>
    </div>

    <div id="stage" class="stage">
      <div id="emptyState" class="empty">
        <div class="empty-icon">✦</div>
        <p>选择图类型与风格，加载示例后点击<b>渲染 SVG</b></p>
        <span>也可以直接拖入 .svg / .json 文件</span>
      </div>
      <div id="canvasWrap" class="canvas-wrap" hidden>
        <div id="canvas" class="canvas"></div>
      </div>
      <div id="dropMask" class="drop-mask">松开以导入文件</div>
    </div>
  </section>

  <!-- ============ 右侧：校验与导出 ============ -->
  <aside class="panel panel-right">
    <section class="block">
      <div class="block-head"><h2>质量门禁</h2><span id="gateSummary" class="hint">—</span></div>
      <div id="gates" class="gates">
        <div class="gate idle"><span class="gate-dot"></span><span class="gate-name">等待渲染</span></div>
      </div>
      <div id="gateDetails" class="gate-details" hidden></div>
    </section>

    <section class="block">
      <div class="block-head"><h2>导出</h2></div>
      <div class="export-grid">
        <button id="btnSvg" class="export-btn" type="button" disabled>
          <span class="ex-icon">◫</span><span class="ex-name">SVG</span><span class="ex-note">矢量源文件</span>
        </button>
        <button id="btnHtml" class="export-btn" type="button" disabled>
          <span class="ex-icon">◉</span><span class="ex-name">交互 HTML</span><span class="ex-note">离线缩放主题</span>
        </button>
      </div>

      <div class="export-row">
        <button id="btnPng" class="btn accent block-btn" type="button" disabled>导出 PNG</button>
        <select id="pngWidth" class="select narrow">
          <option value="960">960px</option>
          <option value="1920" selected>1920px</option>
          <option value="2560">2560px</option>
          <option value="3840">3840px</option>
        </select>
      </div>

      <div class="export-row">
        <button id="btnGif" class="btn accent block-btn" type="button" disabled>生成 GIF 动效</button>
      </div>
      <div id="gifProgress" class="progress" hidden>
        <div class="progress-bar"><i></i></div>
        <span class="progress-text">渲染帧…</span>
      </div>
      <p class="tip">GIF 仅支持带语义契约的 SVG（由本工具渲染生成的图）。</p>
    </section>

    <section class="block grow">
      <div class="block-head">
        <h2>布局报告</h2>
        <button id="btnRaw" class="btn tiny" type="button">查看 JSON</button>
      </div>
      <div id="report" class="report"><p class="muted">渲染后可查看布局与语义报告。</p></div>
    </section>
  </aside>
</main>

<!-- 环境详情弹窗 -->
<div id="modal" class="modal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <h3>运行环境</h3>
      <button id="modalClose" class="btn tiny" type="button">关闭</button>
    </div>
    <pre id="doctorBody" class="modal-body">加载中…</pre>
  </div>
</div>

<!-- 原始 JSON 弹窗 -->
<div id="jsonModal" class="modal" hidden>
  <div class="modal-card wide">
    <div class="modal-head">
      <h3>原始报告</h3>
      <button id="jsonModalClose" class="btn tiny" type="button">关闭</button>
    </div>
    <pre id="jsonBody" class="modal-body">{}</pre>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="/app.js"></script>
</body>
</html>
